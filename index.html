  (function () {

      var p = JSON.parse(localStorage.getItem("palworld-breeding-prefs-v1") || "{}");
      var theme = p.theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

      if (p.lang) document.documentElement.setAttribute("lang", p.lang);
    } catch (e) {}

    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    max-width: 880px;
    margin: 0 auto;
    padding: 20px;
    color: var(--text);
    background: var(--bg);
    transition: background .2s, color .2s;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .icon-btn {
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; width: 38px; height: 34px; font-size: 15px; line-height: 1; transition: all .15s;
  }
  .icon-btn:hover { border-color: var(--green); }
  .lang-switch { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .lang-switch button {
    cursor: pointer; border: none; background: var(--surface); color: var(--muted);
    padding: 0 10px; height: 34px; font-size: 12px; font-weight: 700; font-family: inherit; transition: all .15s;
  }
  .lang-switch button.active { background: var(--green); color: #fff; }
  .pb-btn { cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 14px; transition: all .15s; font-family: inherit; }
  .pb-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pb-btn-primary { background: var(--green); color: #fff; }
  .pb-btn-primary:hover:not(:disabled) { background: var(--green-hover); }
  .pb-btn-tab { background: var(--tab-bg); color: var(--tab-text); }
  .pb-btn-tab.active { background: var(--green); color: #fff; }
  .pb-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; }
  .pb-input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--input-border); font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); }
  .pb-input:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .pb-pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 340px; overflow-y: auto; padding: 4px; }
  .pb-pal-chip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); }
  .pb-pal-chip.selected { background: var(--green-soft); border-color: var(--green); font-weight: 600; }
  .pb-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .remove-btn {
    margin-left: auto; cursor: pointer; flex-shrink: 0;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted-2);
    border-radius: 6px; width: 26px; height: 26px; font-size: 16px; line-height: 1; font-family: inherit; transition: all .15s;
  }
  .remove-btn:hover { background: var(--err-bg); border-color: var(--err-text); color: var(--err-text); }
  .tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .cb { position: relative; }
  .cb-list { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--input-border); border-radius: 8px; margin-top: 2px; max-height: 230px; overflow-y: auto; width: 100%; box-shadow: 0 4px 12px var(--shadow); }
  .cb-item { padding: 7px 10px; cursor: pointer; font-size: 13px; }
  .cb-item:hover { background: var(--soft); }
  label.tiny { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
  .row2 { display: flex; gap: 12px; margin-bottom: 14px; }
  .row2 > div { flex: 1; }
  .result-box { padding: 14px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
  .err-box { font-size: 13px; color: var(--err-text); background: var(--err-bg); padding: 10px; border-radius: 8px; }
  .footer { font-size: 12px; color: var(--muted-2); margin-top: 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

function normKey(a, b) { return [a, b].sort().join("||"); }

const SPECIAL_MAP = new Map();
SPECIAL.forEach(([a, b, child]) => SPECIAL_MAP.set(normKey(a, b), child));

function breed(a, b) {
  if (!a || !b) return null;
  if (a === b) return { child: a, method: "same" };
  // caso genere-dipendente Katress/Wixen
  const pair = [a, b].sort();
  if (pair[0] === "Katress" && pair[1] === "Wixen") {
    return {
      child: null,
      method: "gender",
      note: "genderNote"
    };
  }
  const special = SPECIAL_MAP.get(normKey(a, b));
  if (special) return { child: special, method: "special" };

  if (RANK[a] != null && RANK[b] != null) {
    const targetRank = Math.floor((RANK[a] + RANK[b] + 1) / 2);
    let best = null;
    let bestDiff = Infinity;
    let bestPriority = -Infinity;
    for (const [name, rank] of Object.entries(RANK)) {
      if (NOT_ELIGIBLE.has(name)) continue; // questi non escono mai dalla formula generica
      const diff = Math.abs(rank - targetRank);
      const prio = PRIORITY[name] ?? -Infinity;
      if (diff < bestDiff || (diff === bestDiff && prio > bestPriority)) { bestDiff = diff; bestPriority = prio; best = name; }
    }
    return { child: best, method: "formula", targetRank };
  }
  return { child: null, method: "unknown" };
}

function popcount(mask) {
  let c = 0;
  while (mask) { c += mask & 1; mask >>= 1; }
  return c;
}

// Universo di specie utilizzabili come partner in qualunque passaggio.
const BREED_UNIVERSE = [...new Set([...Object.keys(RANK), ...SPECIAL.flatMap(([a, b]) => [a, b])])];

const reachCache = new Map();
function getReach(fromSpecies) {
  if (reachCache.has(fromSpecies)) return reachCache.get(fromSpecies);
  const map = new Map();
  for (const q of BREED_UNIVERSE) {
    if (q === fromSpecies) continue;
    const r = breed(fromSpecies, q);
    if (r && r.child && r.child !== fromSpecies && !map.has(r.child)) {
      map.set(r.child, { partner: q, method: r.method });
    }
  }
  reachCache.set(fromSpecies, map);
  return map;
}

// BFS: catena di incroci più corta da fromSpecies a toSpecies (qualsiasi partner, fino a maxGen generazioni).
function findSpeciesPath(fromSpecies, toSpecies, maxGen = 5) {
  if (fromSpecies === toSpecies) return { path: [], gen: 0 };
  let frontier = [fromSpecies];
  const visited = new Map([[fromSpecies, null]]);
  for (let gen = 1; gen <= maxGen; gen++) {
    const next = [];
    for (const sp of frontier) {
      const reach = getReach(sp);
      for (const [child, info] of reach) {
        if (visited.has(child)) continue;
        visited.set(child, { prev: sp, partner: info.partner, method: info.method });
        if (child === toSpecies) {
          const path = [];
          let cur = child;
          while (cur !== fromSpecies) {
            const v = visited.get(cur);
            path.unshift({ from: v.prev, to: cur, partner: v.partner, method: v.method });
            cur = v.prev;
          }
          return { path, gen };
        }
        next.push(child);
      }
    }
    frontier = next;
    if (frontier.length === 0) break;
  }
  return null;
}

// Miglior "portatore" per la specie S partendo dai Pal taggati.
function bestCarrierForSpecies(S, carriers) {
  let mask = 0;
  const seeds = [];

  const direct = carriers.find((c) => c.species === S);
  if (direct) {
    mask |= direct.mask;
    seeds.push({ type: "owned", species: S, mask: direct.mask, label: direct.label });
  }

  carriers.forEach((c) => {
    if (c.species === S) return;
    const bitsToGain = c.mask & ~mask;
    if (bitsToGain === 0) return;
    const found = findSpeciesPath(c.species, S);
    if (found) {
      mask |= c.mask;
      seeds.push({
        type: "route", from: c.species, fromLabel: c.label,
        mask: c.mask, species: S, path: found.path, gen: found.gen
      });
    } else {
      seeds.push({ type: "unreachable", from: c.species, fromLabel: c.label, mask: c.mask, species: S });
    }
  });

  return { mask, seeds };
}

// Coppie di specie (sA, sB) che possono generare la specie target.
function finalPairOptionsFor(target) {
  const options = [];
  SPECIAL.forEach(([a, b, c]) => { if (c === target) options.push({ sA: a, sB: b, type: "special" }); });
  options.push({ sA: target, sB: target, type: "same" });
  return options;
}

function planPassives(ownedList, tags, passiveNames, targetSpecies) {
  const names = passiveNames.filter(Boolean);
  if (names.length === 0) return { error: "errNoPassive" };
  const fullMask = (1 << names.length) - 1;

  const carriers = [];
  ownedList.forEach((p) => {
    const tagSet = tags[p] || {};
    let mask = 0;
    names.forEach((n, idx) => { if (tagSet[n]) mask |= (1 << idx); });
    if (mask > 0) carriers.push({ species: p, mask, label: p });
  });

  if (carriers.length === 0) {
    return { error: "errNoCarriers" };
  }

  const pairOptions = finalPairOptionsFor(targetSpecies);

  let best = null;
  for (const opt of pairOptions) {
    const resA = bestCarrierForSpecies(opt.sA, carriers);
    const resB = opt.sB === opt.sA ? resA : bestCarrierForSpecies(opt.sB, carriers);
    const combined = resA.mask | resB.mask;
    const coverage = popcount(combined);
    const score = coverage * 10 + (opt.type === "special" ? 1 : 0); // leggera preferenza alle combo speciali a parità
    if (!best || score > best.score) {
      best = { opt, resA, resB, combined, coverage, score };
    }
  }

  return {
    names, fullMask, targetSpecies,
    pairType: best.opt.type,
    sA: best.opt.sA, sB: best.opt.sB,
    resA: best.resA, resB: best.resB,
    coverage: best.coverage,
    complete: best.combined === fullMask,
    missing: names.filter((_, idx) => !((best.combined >> idx) & 1))
  };
}

const STORAGE_KEY = "palworld-breeding-v1";
const PREFS_KEY = "palworld-breeding-prefs-v1";

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      owned: Array.from(state.owned),
      tags: state.tags,
      passiveNames: state.passiveNames
    }));
  } catch (e) { /* storage non disponibile: si continua senza persistenza */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.owned)) state.owned = new Set(data.owned.filter((p) => ALL_PALS.includes(p)));
    if (data.tags && typeof data.tags === "object") state.tags = data.tags;
    if (Array.isArray(data.passiveNames) && data.passiveNames.length === 4) state.passiveNames = data.passiveNames;
  } catch (e) { /* dati corrotti o storage non disponibile: si parte da zero */ }
}

function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      theme: document.documentElement.getAttribute("data-theme"),
      lang: lang
    }));
  } catch (e) { /* preferenze non persistite */ }
}

/* ============ HELPER UI ============ */

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Numero Paldex formattato (es. "#032B"), o stringa vuota se sconosciuto.
function dexNo(name) {
  const d = PALDEX[name];
  return d ? `#${d}` : "";
}

// Nodo con il numero Paldex (attenuato) seguito dal nome del Pal, usato nelle liste selezionabili.
function palNameNode(name) {
  const frag = document.createDocumentFragment();
  const d = dexNo(name);
  if (d) frag.appendChild(el("span", { style: "color:var(--muted-2);font-size:11px;margin-right:6px" }, d));
  frag.appendChild(document.createTextNode(name));
  return frag;
}

// Nome del Pal con il numero Paldex davanti, per i contesti testuali (risultati, template string).
function palTxt(name) {
  const d = dexNo(name);
  return d ? `${d} ${name}` : name;
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "style") node.style.cssText = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

// Combobox con ricerca (equivalente del GenericCombobox React)
function combobox({ options, value, placeholder, onSelect, renderItem }) {
  const wrap = el("div", { class: "cb" });
  const input = el("input", { class: "pb-input", placeholder: placeholder || "" });
  input.value = value || "";
  const list = el("div", { class: "cb-list", style: "display:none" });
  let open = false;

  function renderList() {
    const q = input.value.trim().toLowerCase();
    const matches = (q ? options.filter((p) => p.toLowerCase().includes(q)) : options).slice(0, 15);
    list.innerHTML = "";
    if (!open || matches.length === 0) { list.style.display = "none"; return; }
    matches.forEach((p) => {
      const item = el("div", { class: "cb-item" }, renderItem ? renderItem(p) : p);
      item.addEventListener("mousedown", () => {
        input.value = p;
        open = false;
        list.style.display = "none";
        onSelect(p);
      });
      list.appendChild(item);
    });
    list.style.display = "block";
  }

  input.addEventListener("input", () => {
    open = true;
    if (!options.includes(input.value)) onSelect("");
    renderList();
  });
  input.addEventListener("focus", () => { open = true; renderList(); });
  input.addEventListener("blur", () => { setTimeout(() => { open = false; list.style.display = "none"; }, 150); });

  wrap.appendChild(input);
  wrap.appendChild(list);
  return wrap;
}

const palCombobox = (opts) => combobox({ ...opts, options: ALL_PALS, renderItem: palNameNode });

// Etichetta della passive nella lingua corrente (la chiave interna resta sempre l'inglese).
function passiveLabel(key) {
  if (!key) return "";
  return lang === "it" ? (PASSIVE_IT.get(key) || key) : key;
}

// Elenco delle passive nella lingua corrente, in ordine alfabetico secondo quella lingua.
function passiveOptions() {
  return PASSIVES.map(([en]) => passiveLabel(en))
    .sort((a, b) => a.localeCompare(b, lang));
}

// La combobox mostra i nomi tradotti ma restituisce sempre la chiave inglese.
const passiveCombobox = (opts) => combobox({
  ...opts,
  options: passiveOptions(),
  value: passiveLabel(opts.value),
  onSelect: (label) => opts.onSelect(PASSIVE_KEY_BY_LABEL.get(label) || "")
});

// Trasforma un effetto in { testo, buono } per il riepilogo.
// "buono" vale true (bonus), false (malus) o null (informativo).
function fxParts(fx) {
  const type = fx[0];
  const pct = (v) => (v > 0 ? "+" : "\u2212") + Math.abs(v) + "%";
  const flat = (v) => (v > 0 ? "+" : "\u2212") + Math.abs(v);

  switch (type) {
    case "elemAtk":
      return { text: `${t("fx_elemAtk", t("el_" + fx[1]))} ${pct(fx[2])}`, good: fx[2] > 0 };
    case "elemRes":
      return { text: `${t("fx_elemRes", t("el_" + fx[1]))} ${pct(fx[2])}`, good: fx[2] > 0 };
    case "hunger":
      return fx[1] > 0
        ? { text: t("fx_hungerSlower", fx[1]), good: true }
        : { text: t("fx_hungerFaster", Math.abs(fx[1])), good: false };
    case "san":
      return fx[1] > 0
        ? { text: t("fx_sanSlower", fx[1]), good: true }
        : { text: t("fx_sanFaster", Math.abs(fx[1])), good: false };
    case "farming":
    case "jump":
      return { text: `${t("fx_" + type)} ${flat(fx[1])}`, good: fx[1] > 0 };
    case "playerStam":
      // meno consumo di resistenza e' un vantaggio, quindi il segno va letto al contrario
      return { text: `${t("fx_playerStam")} ${pct(fx[1])}`, good: fx[1] < 0 };
    case "txt":
      return { text: t("fxt_" + fx[1]), good: fx[2] === undefined ? null : fx[2] };
    default:
      return { text: `${t("fx_" + type)} ${pct(fx[1])}`, good: fx[1] > 0 };
  }
}

function runChainSearch(onDone) {
  if (!state.target) return;
  state.chainRunning = true;
  setTimeout(() => {
    const target = state.target;
    const reachable = new Map(); // pal -> {gen, via}
    state.owned.forEach((p) => reachable.set(p, { gen: 0, via: null }));

    if (reachable.has(target)) {
      state.chainResult = { found: true, gen: 0, via: null, pal: target };
      state.chainRunning = false;
      onDone();
      return;
    }

    let found = null;
    for (let gen = 1; gen <= 4 && !found; gen++) {
      const currentPals = Array.from(reachable.keys());
      const newFinds = [];
      outer: for (let i = 0; i < currentPals.length; i++) {
        for (let j = i; j < currentPals.length; j++) {
          const a = currentPals[i];
          const b = currentPals[j];
          const res = breed(a, b);
          if (!res || !res.child) continue;
          if (!reachable.has(res.child)) {
            newFinds.push([res.child, a, b, res.method]);
            if (res.child === target) {
              found = { pal: target, gen, via: [a, b], method: res.method };
              break outer;
            }
          }
        }
      }
      newFinds.forEach(([child, a, b]) => {
        if (!reachable.has(child)) reachable.set(child, { gen, via: [a, b] });
      });
      // limite di sicurezza
      if (reachable.size > 400) break;
    }

    state.chainResult = found ? { found: true, ...found } : { found: false };
    state.chainRunning = false;
    onDone();
  }, 10);
}

function renderChain(view) {
  const card = el("div", { class: "pb-card" });
  const staticArea = el("div");
  const resultArea = el("div");
  let btn;

  function updateStatic() {
    staticArea.innerHTML = "";
    const target = state.target;
    if (target && SAME_SPECIES_ONLY.has(target) && !state.owned.has(target)) {
      staticArea.appendChild(el("p", { class: "err-box" }, t("sameSpeciesOnly", target)));
    }
    if (target) {
      const specials = SPECIAL.filter(([a, b, c]) => c === target);
      if (specials.length > 0) {
        const wrap = el("div", { style: "margin-bottom:14px" });
        wrap.appendChild(el("div", { style: "font-weight:600;font-size:14px;margin-bottom:6px" }, t("knownCombos", target)));
        specials.forEach(([a, b]) => {
          const line = el("div", { style: "font-size:14px;padding:6px 10px;background:var(--surface);border-radius:8px;margin-bottom:4px;border:1px solid var(--border)" });
          line.appendChild(document.createTextNode(`${palTxt(a)} + ${palTxt(b)} `));
          if (state.owned.has(a) && state.owned.has(b)) {
            line.appendChild(el("span", { class: "pb-badge", style: "background:var(--ok-bg);color:var(--ok-text)" }, t("haveBoth")));
          }
          wrap.appendChild(line);
        });
        staticArea.appendChild(wrap);
      }
    }
  }

  function updateResult() {
    btn.disabled = !state.target || state.chainRunning;
    btn.textContent = state.chainRunning ? t("searching") : t("searchChain");
    resultArea.innerHTML = "";
    const r = state.chainResult;
    if (!r) return;
    const box = el("div", { class: "result-box", style: "margin-top:14px" });
    if (r.found) {
      if (r.gen === 0) {
        box.appendChild(el("p", { style: "margin:0" }, t("alreadyOwned", state.target)));
      } else {
        box.appendChild(el("div", { style: "font-weight:700;margin-bottom:6px" }, t("foundIn", r.gen)));
        box.appendChild(el("div", {}, `${palTxt(r.via[0])} + ${palTxt(r.via[1])} → ${palTxt(state.target)}`));
        const bg = r.method === "special" ? "var(--ok-bg)" : "var(--warn-bg)";
        const fg = r.method === "special" ? "var(--ok-text)" : "var(--warn-text)";
        box.appendChild(el("span", { class: "pb-badge", style: `background:${bg};color:${fg};margin-top:6px` }, t("method_" + r.method)));
        if (r.gen > 1) {
          box.appendChild(el("p", { style: "font-size:12px;color:var(--muted-2);margin:8px 0 0" }, t("chainNote")));
        }
      }
    } else {
      box.appendChild(el("p", { style: "margin:0" }, t("chainNotFound")));
    }
    resultArea.appendChild(box);
  }

  card.appendChild(el("label", { class: "tiny" }, t("targetLabel")));
  const cbWrap = el("div", { style: "margin-bottom:12px" });
  cbWrap.appendChild(palCombobox({
    value: state.target, placeholder: t("searchPlaceholder"),
    onSelect: (v) => { state.target = v; state.chainResult = null; updateStatic(); updateResult(); }
  }));
  card.appendChild(cbWrap);
  card.appendChild(staticArea);

  btn = el("button", { class: "pb-btn pb-btn-primary" }, t("searchChain"));
  btn.addEventListener("click", () => {
    runChainSearch(updateResult);
    btn.disabled = true;
    btn.textContent = t("searching");
  });
  card.appendChild(btn);
  card.appendChild(resultArea);
  updateStatic();
  updateResult();
  view.appendChild(card);
}

/* ============ TAB: PIANO PASSIVE ============ */

function renderPlan(view) {
  const card = el("div", { class: "pb-card" });
  const recapArea = el("div");      // riepilogo bonus/malus delle passive scelte
  const dynamicArea = el("div");   // quick-add + lista taggati (dipende dalle passive scelte)
  const resultArea = el("div");
  let planBtn;

  card.appendChild(el("p", { style: "font-size:13px;color:var(--muted);margin-top:0" }, t("planIntro")));

  // 4 combobox passive
  const passiveGrid = el("div", { class: "grid4", style: "display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px" });
  state.passiveNames.forEach((v, i) => {
    passiveGrid.appendChild(passiveCombobox({
      value: v, placeholder: t("passiveN", i + 1),
      onSelect: (val) => {
        state.passiveNames[i] = val;
        state.planResult = null;
        saveState();
        updateRecap();
        updateDynamic();
        updateResult();
      }
    }));
  });
  card.appendChild(passiveGrid);
  card.appendChild(recapArea);
  card.appendChild(dynamicArea);

  // Riepilogo di bonus e malus delle passive scelte
  function updateRecap() {
    recapArea.innerHTML = "";
    const active = state.passiveNames.filter(Boolean);
    if (active.length === 0) return;

    const wrap = el("div", { style: "margin-bottom:14px" });
    wrap.appendChild(el("div", { style: "font-weight:600;font-size:13px;margin-bottom:6px;color:var(--muted)" }, t("recapTitle")));

    active.forEach((key) => {
      const row = el("div", { style: "padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px" });
      row.appendChild(el("div", { style: "font-weight:700;font-size:13px;margin-bottom:5px" }, passiveLabel(key)));

      const chips = el("div", { style: "display:flex;flex-wrap:wrap;gap:4px" });
      (PASSIVE_FX[key] || []).forEach((fx) => {
        const p = fxParts(fx);
        const bg = p.good === true ? "var(--ok-bg)" : p.good === false ? "var(--err-bg)" : "var(--neutral-bg)";
        const fg = p.good === true ? "var(--ok-text)" : p.good === false ? "var(--err-text)" : "var(--neutral-text)";
        chips.appendChild(el("span", { class: "pb-badge", style: `background:${bg};color:${fg};font-weight:500` }, p.text));
      });
      row.appendChild(chips);
      wrap.appendChild(row);
    });

    recapArea.appendChild(wrap);
  }

  function updateDynamic() {
    dynamicArea.innerHTML = "";
    const active = state.passiveNames.filter(Boolean);
    if (active.length === 0) return;

    dynamicArea.appendChild(el("div", { style: "font-weight:600;font-size:14px;margin-bottom:6px" }, t("addPalTitle")));

    const quickRow = el("div", { style: "display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap" });
    const quickCbWrap = el("div", { style: "width:220px" });
    let addBtn;
    quickCbWrap.appendChild(palCombobox({
      value: state.quickPal, placeholder: t("searchPlaceholder"),
      onSelect: (v) => { state.quickPal = v; addBtn.disabled = !v; }
    }));
    quickRow.appendChild(quickCbWrap);

    active.forEach((n) => {
      const lbl = el("label", { style: "display:flex;align-items:center;gap:4px;font-size:13px" });
      const cb = el("input", { type: "checkbox" });
      cb.checked = !!state.quickTags[n];
      cb.addEventListener("change", () => { state.quickTags[n] = cb.checked; });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(passiveLabel(n)));
      quickRow.appendChild(lbl);
    });

    addBtn = el("button", { class: "pb-btn pb-btn-primary" }, t("addBtn"));
    addBtn.disabled = !state.quickPal;
    addBtn.addEventListener("click", () => {
      state.owned.add(state.quickPal);
      state.tags[state.quickPal] = { ...state.tags[state.quickPal], ...state.quickTags };
      state.quickPal = "";
      state.quickTags = {};
      saveState();
      updateTabLabels();
      updateDynamic();
    });
    quickRow.appendChild(addBtn);
    dynamicArea.appendChild(quickRow);

    if (state.owned.size > 0) {
      const wrap = el("div", { style: "margin-bottom:14px" });
      wrap.appendChild(el("div", { style: "font-weight:600;font-size:13px;margin-bottom:6px;color:var(--muted)" }, t("taggedTitle")));
      const scroll = el("div", { style: "max-height:220px;overflow-y:auto" });
      Array.from(state.owned).forEach((p) => {
        const line = el("div", { style: "display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid var(--border-soft);font-size:13px;flex-wrap:wrap" });
        line.appendChild(el("div", { style: "width:140px;font-weight:600" }, palNameNode(p)));
        active.forEach((n) => {
          const lbl = el("label", { style: "display:flex;align-items:center;gap:4px" });
          const cb = el("input", { type: "checkbox" });
          cb.checked = !!(state.tags[p] && state.tags[p][n]);
          cb.addEventListener("change", () => {
            state.tags[p] = { ...state.tags[p], [n]: cb.checked };
            saveState();
          });
          lbl.appendChild(cb);
          lbl.appendChild(document.createTextNode(passiveLabel(n)));
          line.appendChild(lbl);
        });

        const rm = el("button", { class: "remove-btn", title: t("removePal", p), "aria-label": t("removePal", p) }, "×");
        rm.addEventListener("click", () => {
          state.owned.delete(p);
          delete state.tags[p];
          state.planResult = null; // il piano faceva riferimento a questo Pal: va rigenerato
          saveState();
          updateTabLabels();
          updateDynamic();
          updateResult();
        });
        line.appendChild(rm);

        scroll.appendChild(line);
      });
      wrap.appendChild(scroll);
      dynamicArea.appendChild(wrap);
    }
  }

  // Target + bottone
  card.appendChild(el("label", { class: "tiny" }, t("planTargetLabel")));
  const targetWrap = el("div", { style: "margin-bottom:12px" });
  targetWrap.appendChild(palCombobox({
    value: state.planTarget, placeholder: t("searchPlaceholder"),
    onSelect: (v) => {
      state.planTarget = v;
      state.planResult = null;
      updateResult();
    }
  }));
  card.appendChild(targetWrap);

  planBtn = el("button", { class: "pb-btn pb-btn-primary" }, t("generatePlan"));
  planBtn.disabled = !state.planTarget || !state.passiveNames.some(Boolean);
  planBtn.addEventListener("click", () => {
    state.planResult = planPassives(Array.from(state.owned), state.tags, state.passiveNames, state.planTarget);
    updateResult();
  });
  card.appendChild(planBtn);
  card.appendChild(resultArea);

  function maskNames(names, mask) {
    return names.filter((_, idx) => mask & (1 << idx)).map((n) => esc(passiveLabel(n))).join(", ");
  }

  function updateResult() {
    planBtn.disabled = !state.planTarget || !state.passiveNames.some(Boolean);
    resultArea.innerHTML = "";
    const r = state.planResult;
    if (!r) return;

    const wrap = el("div", { style: "margin-top:16px" });

    if (r.error) {
      wrap.appendChild(el("p", { class: "err-box" }, t(r.error)));
      resultArea.appendChild(wrap);
      return;
    }

    // Riepilogo coppia finale
    const pairHtml = r.sA === r.sB
      ? t("pairSame", esc(r.targetSpecies), esc(r.sA))
      : t("pairCross", esc(r.targetSpecies), esc(r.sA), esc(r.sB),
          r.pairType === "special" ? t("pairKindSpecial") : t("pairKindCross"));
    wrap.appendChild(el("div", { style: "padding:10px;background:var(--soft);border-radius:8px;margin-bottom:12px;font-size:13px", html: pairHtml }));

    // Lati A/B
    const sides = [{ role: r.sA, res: r.resA, label: t("sideA") }];
    if (r.sB !== r.sA) sides.push({ role: r.sB, res: r.resB, label: t("sideB") });

    sides.forEach((side) => {
      const box = el("div", { style: "margin-bottom:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px" });
      box.appendChild(el("div", { style: "font-weight:700;margin-bottom:6px", html: t("sideTitle", esc(side.label), esc(side.role)) }));

      if (side.res.seeds.length === 0) {
        box.appendChild(el("p", { style: "font-size:13px;color:var(--muted-2);margin:0" }, t("sideEmpty", side.role)));
      }

      side.res.seeds.forEach((s) => {
        const seedBg = s.type === "unreachable" ? "var(--err-soft)" : "var(--card)";
        const seed = el("div", { style: `font-size:13px;padding:6px 8px;margin-bottom:4px;border-radius:6px;background:${seedBg}` });

        if (s.type === "owned") {
          seed.innerHTML = t("seedOwned", esc(side.role), maskNames(r.names, s.mask));
        } else if (s.type === "route") {
          const header = t("seedRoute", esc(s.fromLabel), maskNames(r.names, s.mask), esc(side.role), s.gen);
          let chain = `<span class="pb-badge" style="background:var(--soft)">${esc(s.from)}</span>`;
          s.path.forEach((step) => {
            const bg = step.method === "special" ? "var(--ok-bg)" : "var(--warn-bg)";
            const fg = step.method === "special" ? "var(--ok-text)" : "var(--warn-text)";
            chain += ` <span style="color:var(--muted-2)">+ ${esc(step.partner)} →</span> <span class="pb-badge" style="background:${bg};color:${fg}">${esc(step.to)}</span>`;
          });
          seed.innerHTML = `<div>${header}</div><div style="margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:4px">${chain}</div>`;
        } else if (s.type === "unreachable") {
          seed.innerHTML = t("seedUnreachable", esc(s.fromLabel), maskNames(r.names, s.mask), esc(side.role));
        }
        box.appendChild(seed);
      });

      wrap.appendChild(box);
    });

    // Riepilogo finale
    const finalBg = r.complete ? "var(--ok-soft)" : "var(--warn-soft)";
    const finalHtml = r.complete
      ? t("planComplete", r.names.length, esc(r.sA), esc(r.sB), esc(r.targetSpecies))
      : t("planPartial", r.coverage, r.names.length, r.missing.map((n) => esc(passiveLabel(n))).join(", "));
    wrap.appendChild(el("div", { style: `padding:12px;background:${finalBg};border:1px solid var(--border);border-radius:8px`, html: finalHtml }));

    wrap.appendChild(el("p", { style: "font-size:12px;color:var(--muted-2);margin-top:12px", html: t("planTip") }));

    resultArea.appendChild(wrap);
  }

  updateRecap();
  updateDynamic();
  updateResult();
  view.appendChild(card);
}

/* ============ TEMA, LINGUA, ROUTER ============ */

function updateThemeButton() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const btn = document.getElementById("theme-toggle");
  btn.textContent = dark ? "☀" : "☾";
  btn.title = dark ? t("themeToLight") : t("themeToDark");
  btn.setAttribute("aria-label", btn.title);
}

function updateTabLabels() {
  document.getElementById("tab-btn-palbox").textContent = t("tabPalbox", state.owned.size);
  document.getElementById("tab-btn-calc").textContent = t("tabCalc");
  document.getElementById("tab-btn-chain").textContent = t("tabChain");
  document.getElementById("tab-btn-plan").textContent = t("tabPlan");
}

function applyLanguage() {
  document.documentElement.setAttribute("lang", lang);
  document.title = t("docTitle");
  document.getElementById("app-title").textContent = t("title");
  document.getElementById("app-subtitle").textContent = t("subtitle");
  document.getElementById("footer-note").textContent = t("footerNote");
  document.getElementById("reset-data").textContent = t("resetBtn");
  document.querySelectorAll(".lang-switch button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  updateTabLabels();
  updateThemeButton();
}

function renderTab() {
  const view = document.getElementById("view");
  view.innerHTML = "";
  document.querySelectorAll(".pb-btn-tab").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
  if (state.tab === "palbox") renderPalbox(view);
  else if (state.tab === "calc") renderCalc(view);
  else if (state.tab === "chain") renderChain(view);
  else if (state.tab === "plan") renderPlan(view);
}

document.querySelectorAll(".pb-btn-tab").forEach((b) => {
  b.addEventListener("click", () => { state.tab = b.dataset.tab; renderTab(); });
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  updateThemeButton();
  savePrefs();
});

document.querySelectorAll(".lang-switch button").forEach((b) => {
  b.addEventListener("click", () => {
    if (lang === b.dataset.lang) return;
    lang = b.dataset.lang;
    savePrefs();
    applyLanguage();
    renderTab();
  });
});

document.getElementById("reset-data").addEventListener("click", () => {
  if (!confirm(t("resetConfirm"))) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.owned = new Set();
  state.tags = {};
  state.passiveNames = ["", "", "", ""];
  state.planResult = null;
  state.chainResult = null;
  applyLanguage();
  renderTab();
});

loadState();
applyLanguage();
renderTab();

</script>
</body>
</html>
